[package]
name = "statusline-powerline"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Powerline status line for Claude Code"
publish = false

[[bin]]
name = "StatusLinePowerline"
path = "src/main.rs"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
